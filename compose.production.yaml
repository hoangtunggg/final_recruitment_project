name: job-portal-prod

services:
  secrets-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    user: "0:0"
    volumes:
      - mysql_secrets:/run/db-secrets
    command: node scripts/ensureDockerDbSecrets.js /run/db-secrets
    restart: "no"

  db:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: job_portal
      MYSQL_USER: job_portal_app
      MYSQL_PASSWORD_FILE: /run/db-secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/db-secrets/mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_secrets:/run/db-secrets:ro
    networks: [data]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$(cat /run/db-secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: job_portal
      DB_USER: job_portal_app
      DB_SSL: "false"
      DB_AUTO_CREATE: "false"
    volumes:
      - mysql_secrets:/run/db-secrets:ro
    networks: [data]
    command: ["sh", "-c", "export DB_PASSWORD=$$(cat /run/db-secrets/mysql_app_password); exec npm run migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: job_portal
      DB_USER: job_portal_app
      DB_SSL: "false"
      DB_AUTO_CREATE: "false"
      DB_SKIP_SCHEMA_INIT: "true"
      DB_POOL_MAX: 5
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8080}
      LOG_LEVEL: info
    volumes:
      - mysql_secrets:/run/db-secrets:ro
      - resume_cache:/app/uploads/resumes
    expose: ["3001"]
    networks: [edge, data, monitoring]
    command: ["sh", "-c", "export DB_PASSWORD=$$(cat /run/db-secrets/mysql_app_password); exec node src/index.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: "/"
    ports:
      - "127.0.0.1:${PROD_HTTP_PORT:-8080}:80"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/web-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [data, monitoring]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [monitoring, ops-access]
    depends_on: [backend, redis-exporter]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/db-secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - mysql_secrets:/run/db-secrets:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [monitoring, ops-access]
    depends_on: [prometheus]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true
  ops-access:

volumes:
  mysql_data:
  mysql_secrets:
  redis_data:
  resume_cache:
  prometheus_data:
  grafana_data:
