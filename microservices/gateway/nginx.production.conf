# HTTPS termination template. Mount certificates outside Git and replace nginx.conf with this file.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_read_timeout 15s;
  map $http_x_request_id $request_id_safe { "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id; default $request_id; }
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  upstream identity { server identity-service:3000; }
  upstream users { server user-service:3000; }
  upstream companies { server company-service:3000; }
  upstream jobs { server job-service:3000; }
  upstream resumes { server resume-service:3000; }
  upstream applications { server application-service:3000; }
  upstream notifications { server notification-service:3000; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  server { listen 8080; server_name _; return 301 https://$host$request_uri; }
  server {
    listen 8443 ssl http2; server_name _;
    ssl_certificate /run/tls/tls.crt; ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3; client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location /api/auth/ { limit_req zone=api_per_ip burst=10 nodelay; proxy_pass http://identity; include /etc/nginx/proxy_params.conf; }
    location /api/users { proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/settings { rewrite ^/api/settings(.*)$ /api/users/settings$1 break; proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/audit { rewrite ^/api/audit(.*)$ /api/users/audit$1 break; proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/companies { proxy_pass http://companies; include /etc/nginx/proxy_params.conf; }
    location /api/jobs { proxy_pass http://jobs; include /etc/nginx/proxy_params.conf; }
    location /api/resumes { proxy_pass http://resumes; include /etc/nginx/proxy_params.conf; }
    location /api/applications { proxy_pass http://applications; include /etc/nginx/proxy_params.conf; }
    location /api/matches { set $matching_optional matching-service:8000; proxy_pass http://$matching_optional; include /etc/nginx/proxy_params.conf; proxy_read_timeout 25s; }
    location /api/notifications { proxy_pass http://notifications; include /etc/nginx/proxy_params.conf; }
    # AI mock interview: SSE turns must stream (no buffering) and an LLM turn can take > 15s; CV / audio uploads <= 11 MB.
    # Resolved per request (like matching) so the gateway still starts when interview-service is not deployed.
    location /api/interviews { set $interview_optional interview-service:3000; client_max_body_size 12m; proxy_pass http://$interview_optional; include /etc/nginx/proxy_params.conf; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 180s; proxy_send_timeout 60s; }
  }
}
