worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/json;
  access_log /dev/stdout combined;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_read_timeout 15s;
  map $http_x_request_id $request_id_safe { "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id; default $request_id; }
  # Behind the staging TLS proxy (Caddy on the shared Docker network hireready-edge, 172.30.0.0/24) every request
  # would otherwise come from the proxy IP, so all users would share one rate-limit/conn-limit bucket. Trust
  # X-Forwarded-For only from that subnet; direct clients (local dev, LAN) cannot spoof their address.
  set_real_ip_from 172.30.0.0/24;
  real_ip_header X-Forwarded-For;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
  upstream identity { server identity-service:3000; keepalive 16; }
  upstream users { server user-service:3000; keepalive 16; }
  upstream companies { server company-service:3000; keepalive 16; }
  upstream jobs { server job-service:3000; keepalive 16; }
  upstream resumes { server resume-service:3000; keepalive 8; }
  upstream applications { server application-service:3000; keepalive 8; }
  upstream notifications { server notification-service:3000; keepalive 16; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;
    limit_conn connections_per_ip 30;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { access_log off; return 200 '{"status":"healthy","service":"api-gateway"}'; }
    location /api/auth/ { limit_req zone=api_per_ip burst=10 nodelay; proxy_pass http://identity; include /etc/nginx/proxy_params.conf; }
    location /api/users/ { proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location = /api/users { proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/settings { rewrite ^/api/settings(.*)$ /api/users/settings$1 break; proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/audit { rewrite ^/api/audit(.*)$ /api/users/audit$1 break; proxy_pass http://users; include /etc/nginx/proxy_params.conf; }
    location /api/companies { proxy_pass http://companies; include /etc/nginx/proxy_params.conf; }
    location /api/jobs { proxy_pass http://jobs; include /etc/nginx/proxy_params.conf; }
    location /api/resumes { limit_req zone=api_per_ip burst=20 nodelay; proxy_pass http://resumes; include /etc/nginx/proxy_params.conf; proxy_request_buffering on; }
    location /api/applications { limit_req zone=api_per_ip burst=20 nodelay; proxy_pass http://applications; include /etc/nginx/proxy_params.conf; }
    location /api/matches { set $matching_optional matching-service:8000; limit_req zone=api_per_ip burst=3 nodelay; proxy_pass http://$matching_optional; include /etc/nginx/proxy_params.conf; proxy_read_timeout 25s; }
    location /api/notifications { proxy_pass http://notifications; include /etc/nginx/proxy_params.conf; }
    # AI mock interview: SSE turns stream because interview-service sends X-Accel-Buffering: no (proxy_params sets buffering on) and an LLM turn can take > 15s; CV / audio uploads <= 11 MB.
    # Resolved per request (like matching) so the gateway still starts when interview-service is not deployed.
    location /api/interviews { set $interview_optional interview-service:3000; limit_req zone=api_per_ip burst=20 nodelay; client_max_body_size 12m; proxy_pass http://$interview_optional; include /etc/nginx/proxy_params.conf; proxy_request_buffering off; proxy_read_timeout 180s; }
  }
}
