global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: job-portal-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 3001
        refresh_interval: 10s

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
